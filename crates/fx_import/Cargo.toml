[package]
name = "fx_import"
description = "Reader for Unreal Engine 4.26+/5 editor packages (.uasset): summary, names, imports, exports and tagged properties"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fx_core = { path = "../fx_core" }
oozextract = { version = "0.5", default-features = false }
png = "0.17"
# zlib, for UE4 packages' compressed bulk data (already in the tree via png).
miniz_oxide = "0.8"

[[bin]]
name = "fximport"
path = "src/bin/fximport.rs"
