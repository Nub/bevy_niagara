[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "web"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# bevy_winit is on for every crate (the viewer needs it) so features never
# differ between builds; headless tools disable WinitPlugin.
# glTF scenes with skinning and animation (default SkeletalMesh data
# interfaces) need bevy_gltf, bevy_animation, gltf_animation and
# bevy_world_serialization (scene spawning); 3d_bevy_render includes them,
# they are listed so they stay on.
# The user's Bevy fork (Bevy 0.20.0-dev), wired by absolute path so every
# worktree of this repo resolves the same checkout.
bevy_math = { path = "/home/zach/helm-projects/bevy-solari-opt/crates/bevy_math", default-features = false, features = ["std"] }
bevy = { path = "/home/zach/helm-projects/bevy-solari-opt", default-features = false, features = ["default_app", "std", "multi_threaded", "3d_bevy_render", "bevy_window", "bevy_winit", "x11", "wayland", "png", "bevy_gltf", "bevy_animation", "gltf_animation", "bevy_world_serialization"] }
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Same wgpu as the fork's bevy_render, so fx_gpu's types are Bevy's.
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "fragile-send-sync-non-atomic-wasm"] }
bytemuck = { version = "1.5", features = ["derive"] }

# Mirror the fork's patch: its Solari partitioned TLAS needs the vendored
# wgpu-hal, and a [patch] only applies from the root workspace.
[patch.crates-io]
wgpu-hal = { path = "/home/zach/helm-projects/bevy-solari-opt/vendor/wgpu-hal" }

# The browser build (web/build.sh): smallest download.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
